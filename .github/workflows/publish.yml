name: publish
# Ships a tagged release to RubyGems through the trusted publisher (OIDC): no API key, no password.
# Tag must match the VERSION in lib/camada/version.rb, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: tag matches the gem version
        run: |
          v=$(ruby -e 'require "./lib/camada/version"; puts Camada::VERSION')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: rubygems/release-gem@v1
