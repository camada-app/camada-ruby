name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04  # Ruby 3.1 has no prebuilt for the Ubuntu 26 image ubuntu-latest moved to
    strategy:
      fail-fast: false # every leg reports: Onigmo changes land per Ruby patch release (camada-all-ozix)
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-ruby }
      # The suite reads golden fixtures from camada-core and pins camada-browser to the vendored release tag.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - id: beacon
        run: |
          v=$(sed -n 's/^[[:space:]]*BEACON_VERSION = "\([^"]*\)"$/\1/p' camada-ruby/lib/camada/beacon_js.rb)
          [ -n "$v" ] || { echo "::error::no vendored beacon version in camada-ruby/lib/camada/beacon_js.rb"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
          path: camada-browser
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: camada-ruby
      - run: bundle exec rubocop && bundle exec rspec
        working-directory: camada-ruby
